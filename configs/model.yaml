project: arabic-fewshot-font
status: preparation_only
training_enabled: false
conditioning_modes: [reference_image, text_prompt, hybrid]
shared_style_geometry_latent:
  enabled: true
  dimension: 256
  confidence_per_attribute: true
shared_arabic_aware_generator:
  enabled: true
  shared_across_all_modes: true
baseline:
  name: MX-Font
  upstream: https://github.com/clovaai/fewshot-font-generation
  paper: https://openaccess.thecvf.com/content/ICCV2021/html/Park_Multiple_Heads_Are_Better_Than_One_Few-Shot_Font_Generation_With_Multiple_Localized_Experts_ICCV_2021_paper.html
  preserve_upstream_checkpoint: true
  fine_tune: false
modules:
  content_encoder:
    source: mxfont
  localized_style_experts:
    source: mxfont
    note: "Already part of MX-Font; do not count as a newly merged model."
  arabic_context_branch:
    enabled: false
    inputs: [codepoint, script, language, joining_type, left_join_state, right_join_state, requested_form]
  topology_refinement:
    enabled: false
    targets: [connectivity, components, dots, counters, stroke_endpoints, mark_placement]
  prompt_style_encoder:
    enabled: true
    backbone: pretrained_arabic_capable_text_encoder
    projection_head: trainable
    train_large_language_model_from_scratch: false
    languages: [ar, en]
  shared_style_geometry_alignment:
    enabled: true
    objectives: [paired_image_prompt_alignment, attribute_supervision, geometry_regression]
  hybrid_conditioning:
    enabled: true
    fusion: learned_confidence_aware_fusion
  confidence_gate:
    enabled: false
    outputs: [prediction, uncertainty, reference_ids]
output:
  raster:
    channels: 1
    size: [128, 128]
  vectorization:
    enabled: false
    toolchain: [potrace_or_learned_contours, fonttools, harfbuzz]
training:
  seed: 2026
  mixed_precision: true
  freeze_baseline_first: true
  staged_ablation: [B0, B1, B2, B3, B4, B5]
