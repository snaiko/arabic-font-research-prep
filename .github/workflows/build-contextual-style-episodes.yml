name: Build contextual few-shot Arabic style episodes

on:
  workflow_run:
    workflows: ["Validate Arabic glyph data and adapters"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: contextual-style-episodes-main
  cancel-in-progress: true

jobs:
  build-episodes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model preflight dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install Pillow numpy
      - name: Download contextual cluster targets from the completed data audit
        uses: actions/download-artifact@v4
        with:
          name: arabic-harfbuzz-contextual-clusters
          path: .audit/contextual
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download isolated same-font style references from the completed data audit
        uses: actions/download-artifact@v4
        with:
          name: isolated-arabic-glyph-crops
          path: .audit/isolated
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download the exact conditional OFL rights manifest
        uses: actions/download-artifact@v4
        with:
          name: conditional-ofl-font-rights-manifest
          path: .audit/rights
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build leakage-safe contextual style episodes
        run: |
          python scripts/build_contextual_style_episodes.py --targets .audit/contextual/contextual_clusters.jsonl --references .audit/isolated/glyph_crops.jsonl --target-root .audit/contextual --reference-root .audit/isolated --output reports/contextual_style_episodes --refs-per-episode 4 --seed 20261119
      - name: Run no-training real-data preflight
        run: |
          RIGHTS_MANIFEST="$(find .audit/rights -name font_rights.json -type f -print -quit)"
          test -n "$RIGHTS_MANIFEST"
          echo "Using rights manifest: $RIGHTS_MANIFEST"
          python -m scripts.preflight_multimodal_training --episodes-dir reports/contextual_style_episodes --target-root .audit/contextual --reference-root .audit/isolated --rights-manifest "$RIGHTS_MANIFEST" --output reports/contextual_style_episodes/preflight.json
      - name: Exercise the exact Windows local-preflight logic on the CI runner
        run: |
          mkdir -p data/contextual_style_episodes data/contextual_glyph_crops data/glyph_crops data/manifests
          cp -a reports/contextual_style_episodes/. data/contextual_style_episodes/
          cp -a .audit/contextual/. data/contextual_glyph_crops/
          cp -a .audit/isolated/. data/glyph_crops/
          RIGHTS_MANIFEST="$(find .audit/rights -name font_rights.json -type f -print -quit)"
          test -n "$RIGHTS_MANIFEST"
          cp "$RIGHTS_MANIFEST" data/manifests/font_rights.json
          python scripts/preflight_local_training.py > reports/ci_local_preflight.json
          cat reports/ci_local_preflight.json
      - name: Assemble one complete local training data handoff
        run: |
          mkdir -p reports/training_handoff/data/contextual_style_episodes
          mkdir -p reports/training_handoff/data/contextual_glyph_crops
          mkdir -p reports/training_handoff/data/glyph_crops
          mkdir -p reports/training_handoff/data/manifests
          cp -a reports/contextual_style_episodes/. reports/training_handoff/data/contextual_style_episodes/
          cp -a .audit/contextual/. reports/training_handoff/data/contextual_glyph_crops/
          cp -a .audit/isolated/. reports/training_handoff/data/glyph_crops/
          RIGHTS_MANIFEST="$(find .audit/rights -name font_rights.json -type f -print -quit)"
          test -n "$RIGHTS_MANIFEST"
          cp "$RIGHTS_MANIFEST" reports/training_handoff/data/manifests/font_rights.json
          cat > reports/training_handoff/README.md <<'EOF'
          # Arabic Font Experimental Training Data Handoff

          Extract this folder into the root of a fresh clone of snaiko/arabic-font-research-prep.
          The folder layout is already aligned with the Windows launchers:
          - data/contextual_style_episodes/ — train, validation, test and no-training preflight.
          - data/contextual_glyph_crops/ — contextual target metadata and target images.
          - data/glyph_crops/ — isolated same-font reference metadata and reference images.
          - data/manifests/font_rights.json — exact conditional OFL 1.1 source-font rights manifest.

          Expected audited data: 1,732 episodes (1,134 train / 299 validation / 299 test), 20 font families, 52 approved font files, 1,732 contextual target PNGs and 1,872 isolated reference PNGs. Episodes contain 6,928 reference uses, drawn from 1,831 distinct reference PNGs; 41 additional valid reference crops are retained in the source crop corpus but are not sampled by these episodes.

          This artifact prepares only the separate experimental image-reference raster prototype. It is not native MX-Font and is not a merged model. It contains no trained weights and no training has been run. Output is raster only, not TTF/OTF. Generated font software based on these sources must be released under SIL OFL 1.1. OFL is not a NonCommercial license; downstream commercial use is not prohibited by OFL terms.
          EOF
      - name: Upload complete one-download local training handoff
        uses: actions/upload-artifact@v4
        with:
          name: arabic-font-training-handoff
          path: reports/training_handoff
          if-no-files-found: error
          retention-days: 90
      - name: Upload contextual episodes and no-training preflight
        uses: actions/upload-artifact@v4
        with:
          name: arabic-contextual-style-episodes
          path: reports/contextual_style_episodes
          if-no-files-found: error
          retention-days: 90
