name: Validate Arabic glyph data and adapters

on:
  push:
    paths:
      - "scripts/**"
      - "schemas/glyph_visual_annotation.schema.json"
      - "schemas/font_rights_manifest.schema.json"
      - "data/arabic_character_system_v1.json"
      - "data/shaping_regression_cases_v1.json"
      - "data/manifests/font_rights.template.json"
      - "docs/ARABIC_CHARACTER_SYSTEM.md"
      - "docs/ARABIC_SCRIPT_AND_VISUAL_SYSTEM_V2.md"
      - "docs/FONT_RIGHTS_AND_BATCH_SHAPING.md"
      - "docs/ARABIC_HUMAN_REVIEW_PROTOCOL.md"
      - "tests/**"
      - ".github/workflows/test-glyph-adapter.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/glyph_visual_annotation.schema.json"
      - "schemas/font_rights_manifest.schema.json"
      - "data/arabic_character_system_v1.json"
      - "data/shaping_regression_cases_v1.json"
      - "data/manifests/font_rights.template.json"
      - "docs/ARABIC_CHARACTER_SYSTEM.md"
      - "docs/ARABIC_SCRIPT_AND_VISUAL_SYSTEM_V2.md"
      - "docs/FONT_RIGHTS_AND_BATCH_SHAPING.md"
      - "tests/**"
      - ".github/workflows/test-glyph-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster and shaping dependencies
        run: python -m pip install --upgrade Pillow uharfbuzz fonttools CairoSVG
      - name: Compile scripts
        run: python -m py_compile scripts/audit_glyph_crops.py scripts/build_isolated_glyph_crops.py scripts/build_mxfont_episodes.py scripts/validate_arabic_character_system.py scripts/import_unicode_arabic_registry.py scripts/validate_arabic_script_registry.py scripts/validate_glyph_visual_annotation.py scripts/validate_font_rights_manifest.py scripts/run_batch_shaping_regression.py scripts/run_shaping_regression.py scripts/compare_glyph_annotations.py scripts/audit_training_corpus.py scripts/audit_glyph_crops.py scripts/build_harfbuzz_contextual_crops.py scripts/audit_harfbuzz_contextual_crops.py scripts/build_arabic_review_pack.py
      - name: Validate starter Arabic registry
        run: python scripts/validate_arabic_character_system.py
      - name: Generate complete Unicode 17 Arabic registry
        run: python scripts/import_unicode_arabic_registry.py --download
      - name: Validate generated Unicode registry
        run: python scripts/validate_arabic_script_registry.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Download published font and glyph datasets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .audit/font .audit/glyph
          gh release download arabic-font-corpus-v1 --repo "${GITHUB_REPOSITORY}" --pattern "arabic-font-corpus.zip" --dir .audit/font
          gh release download arabic-glyph-dataset-v1 --repo "${GITHUB_REPOSITORY}" --pattern "arabic-glyph-training-dataset.zip" --dir .audit/glyph
          unzip -oq .audit/font/arabic-font-corpus.zip -d .
          unzip -oq .audit/glyph/arabic-glyph-training-dataset.zip -d data/training_samples
      - name: Audit the actual published training corpus
        run: |
          python scripts/audit_training_corpus.py --samples data/training_samples/samples.jsonl --font-root data/raw_fonts --image-root data/training_samples --output reports/local/dataset_audit.json
      - name: Build isolated Arabic glyph crops from published corpus
        run: |
          python scripts/build_isolated_glyph_crops.py --samples data/training_samples/samples.jsonl --font-root data/raw_fonts --output data/glyph_crops
      - name: Build HarfBuzz cluster-aware contextual crops
        run: |
          python scripts/build_harfbuzz_contextual_crops.py --fonts data/raw_fonts --collection data/raw_fonts/fonts.jsonl --cases data/shaping_regression_cases_v1.json --samples data/training_samples/samples.jsonl --output data/contextual_glyph_crops
      - name: Independently audit contextual cluster dataset
        run: |
          python scripts/audit_harfbuzz_contextual_crops.py --manifest data/contextual_glyph_crops/contextual_clusters.jsonl --crop-root data/contextual_glyph_crops --font-root data/raw_fonts --cases data/shaping_regression_cases_v1.json --samples data/training_samples/samples.jsonl --output reports/local/contextual_cluster_audit.json
      - name: Upload contextual cluster audit report
        uses: actions/upload-artifact@v4
        with:
          name: arabic-contextual-cluster-audit
          path: reports/local/contextual_cluster_audit.json
          if-no-files-found: error
      - name: Build stratified Arabic human review pack
        run: |
          python scripts/build_arabic_review_pack.py --manifest data/contextual_glyph_crops/contextual_clusters.jsonl --crop-root data/contextual_glyph_crops --output reports/review_pack --per-case 10 --geometry-count 40 --seed 20261119
      - name: Upload Arabic human review pack
        uses: actions/upload-artifact@v4
        with:
          name: arabic-human-review-pack
          path: reports/review_pack
          if-no-files-found: error
      - name: Upload contextual cluster dataset
        uses: actions/upload-artifact@v4
        with:
          name: arabic-harfbuzz-contextual-clusters
          path: data/contextual_glyph_crops
          if-no-files-found: error
      - name: Audit generated glyph crops
        run: |
          python scripts/audit_glyph_crops.py --manifest data/glyph_crops/glyph_crops.jsonl --crop-root data/glyph_crops --font-root data/raw_fonts --output reports/local/glyph_crop_audit.json
      - name: Upload generated glyph crop dataset
        uses: actions/upload-artifact@v4
        with:
          name: isolated-arabic-glyph-crops
          path: data/glyph_crops
          if-no-files-found: error
      - name: Upload glyph crop audit report
        uses: actions/upload-artifact@v4
        with:
          name: isolated-glyph-crop-audit
          path: reports/local/glyph_crop_audit.json
          if-no-files-found: error
      - name: Upload corpus audit report
        uses: actions/upload-artifact@v4
        with:
          name: published-training-corpus-audit
          path: reports/local/dataset_audit.json
          if-no-files-found: error
      - name: Upload generated Unicode registry
        uses: actions/upload-artifact@v4
        with:
          name: arabic-script-registry-unicode-17
          path: data/arabic_script_registry_v2.json
          if-no-files-found: error
