name: Test multimodal Arabic glyph model
on:
  push:
    paths:
      - "models/**"
      - "scripts/train_multimodal_glyph.py"
      - "tests/test_multimodal*.py"
      - "requirements-model-smoke.txt"
      - ".github/workflows/test-multimodal-model.yml"
  pull_request:
    paths:
      - "models/**"
      - "scripts/train_multimodal_glyph.py"
      - "tests/test_multimodal*.py"
      - "requirements-model-smoke.txt"
      - ".github/workflows/test-multimodal-model.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch && python -m pip install Pillow
      - name: Compile model and training pipeline
        run: python -m py_compile models/arabic_multimodal_glyph.py scripts/train_multimodal_glyph.py
      - name: Run model and training-pipeline unit tests
        run: python -m unittest discover -s tests -p "test_multimodal*.py" -v
